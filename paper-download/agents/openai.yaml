interface:
  display_name: "论文下载"
  short_description: "优先复用论文资料入库，只补缺项并控制自动抓取和超时重试"
  default_prompt: "Use $paper-download to check Zotero, the confirmed workspace collection and known source files and metadata first, then obtain only missing requested versions. Do not create per-paper or per-search-task collections, and do not turn local organization into a version-upgrade download. Follow the shared import preflight before any new item, including metadata-only imports: suppress unrequested automatic fetching, preserve the user's preferences, serialize native writes and inspect the same operation after a timeout. On Windows, use the bundled IEEE/Optica institutional-access module through the managed web-access Edge Broker with existing browser login state. The module must run its managed preflight and require a passed control probe; it does not fall back to the daily browser or Chrome. It may submit one uniquely verified, already-autofilled HTTPS login form without returning field values; ambiguous forms, MFA, verification, or unknown results use user handoff. Never read or store school passwords, browser passwords, cookies, or tokens; a user saying login is complete requires page and access readback before resuming. Distinguish Broker readiness, login, article permission, verified PDF and saved attachment. Respect host denials and user verification; do not repeat unknown submissions. Preserve memberships, annotations and existing notes. Create local exports or indexes only when requested or required."

policy:
  allow_implicit_invocation: true
