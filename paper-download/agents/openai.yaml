interface:
  display_name: "论文下载"
  short_description: "论文 PDF 下载到 Zotero，先查重再补附件，复用机构登录"
  default_prompt: "Use $paper-download to check Zotero for existing items and usable attachments, download only missing requested versions, and verify PDFs stored under matching items. Reuse the article or research task collection and preserve other memberships. Keep paper reading notes about the source paper; put manuscript-specific citation planning in its existing workspace materials. Reuse browser sign-in and autofill without reading credentials. Create local exports or indexes only when requested or required by the project."

dependencies:
  tools:
    - type: "mcp"
      value: "paper-search-mcp"
      description: "Search academic metadata and download open-access or authorized PDFs before falling back to browser-based retrieval."
      transport: "stdio"

policy:
  allow_implicit_invocation: true
