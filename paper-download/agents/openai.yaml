interface:
  display_name: "论文下载"
  short_description: "优先复用论文资料入库，只补缺项并控制自动抓取和超时重试"
  default_prompt: "Use $paper-download to check Zotero, the task collection and known task-local PDFs and metadata first, then obtain only missing requested versions. Do not turn local organization into a version-upgrade download. Follow the shared import preflight before any new item, including metadata-only imports: suppress unrequested automatic fetching, preserve the user's preferences, serialize native writes and inspect the same operation after a timeout. Prefer an existing host-permitted local credential/download helper for authorized institutional access; inspect readiness and the same session before login, and continue through PDF verification, native Zotero import and readback. Keep passwords inside the local executor and OS credential store; never expose them to the model. Distinguish environment readiness, login, article permission, verified PDF and saved attachment. Respect host denials and user verification; do not repeat unknown submissions. Preserve memberships, annotations and existing notes. Create local exports or indexes only when requested or required."

policy:
  allow_implicit_invocation: true
