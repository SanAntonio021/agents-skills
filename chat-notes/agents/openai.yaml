interface:
  display_name: "chat-notes"
  short_description: "显式收尾时按依赖关系检查、执行和验收五项工作"
  default_prompt: "Use $chat-notes only for an explicit invocation or an explicit request to finish with this skill. Read SKILL.md and follow its five judgment-action-verification workflows: project Markdown, experiment records, lessons and skill gaps, recoverable cleanup, and commit/publication/runtime sync. First identify the actual task scope, current materials and user limits. Review complete affected entry documents and necessary related records; choose no change, local update, integration or restructuring from actual responsibilities, duplication and usability, never from length alone. Preserve meaningful facts and evidence while keeping one primary home for detailed content. For lessons and skill gaps, follow section 3 of SKILL.md for assessment, placement, action and verification. A blocked item must not stop independent authorized work. Preserve original data, user changes, working drafts and dependencies; relocate and verify needed content before recoverable cleanup. Keep project and skill publication separate and follow the existing supported sync process. Do not create closing reports or claim success from assertions alone. Return the five feedback items defined in SKILL.md, including the Markdown organization decision and its evidence."
