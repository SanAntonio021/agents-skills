interface:
  display_name: "工程产品调研工作簿"
  short_description: "统一产品研究过程、参数表、采购渠道和业务验收"
  default_prompt: "Use $product-research-workbook to create, normalize, or audit an engineering product research workbook with sample-first fields, evidence separation, stable numeric IDs, parameter sheets, and procurement channels. When confirmed categories include a whole machine, assign its parameter sheet order 1 and put components and subsystems in separate later sheets; do not infer those categories from the sheet names. For a historical source, first use the bundled inspect_product_samples.py helper and only analyze its sanitized inventory; never dump or read the source identifier column into a new JSON, CSV, report, example, or mapping. Treat any legacy prefixed manual row labels as audit-only source facts rather than product IDs or models; treat concrete legacy values as non-quotable, including in negative examples and scan patterns. Refer to source rows/cells, run the bundled no-legacy scan before publishing, and never create old-to-new mapping tables, examples, CSVs, or JSON keys in new outputs."
