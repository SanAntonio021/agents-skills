interface:
  display_name: "工程产品调研工作簿"
  short_description: "维护产品库分类、稳定编号、来源追溯和采购关联"
  default_prompt: "Use $product-research-workbook to establish or maintain an engineering product library, update records already governed by its contract, or perform an explicitly requested contract audit. Read the request and existing files before choosing the workflow; ordinary one-off parameter or procurement-channel comparisons and formatting-only edits belong to xlsx. Preserve existing process/formal workbooks, stable published IDs, source traceability and procurement associations. Reuse confirmed fields without another approval. Keep whole-machine tables first when confirmed categories include one, and group components by engineering form and compatible fields. Preserve historical identifiers by default; use the sanitized-inventory and no-legacy-scan helpers only when the current project explicitly requires removing those identifiers. Keep audits read-only and never migrate a real workbook without authorization."
