interface:
  display_name: "chat-notes"
  short_description: "显式收尾时并行检查项目文档、实验记录、经验缺口、清场和发布状态"
  default_prompt: "Use $chat-notes only for an explicit skill call or an explicit request to finish with chat-notes. On each call, inspect all five independent tracks: project Markdown, Feishu or laboratory records, reusable lessons and skill gaps, process-file cleanup, and commit/publish/runtime synchronization. Report one status per track using the defined status vocabulary; a no-op or blocked track must not stop other independent work. Put project facts in existing README, AGENTS, or project records; put experiment steps and results in the selected Feishu or laboratory record; propose concrete cross-project skill changes but do not edit a Skill before user confirmation. Distinguish incremental Markdown sync, affected-file integration, and full entry refactoring; only inspect the current affected files, not the whole repository. Explicit user limits such as discussion-only, read-only, no deletion, no commit, no push, no publish, or a file scope override defaults. When cleanup is authorized, preserve originals, current deliverables or pending drafts, comparison versions, source and tests, raw data, dependencies, evidence, user edits, and active files; clean only proven unused process files with recoverable verification. Keep project publication and Skill publication separate, and report runtime synchronization only after the supported helper and identical VerifyOnly pass. Return the fixed five-part feedback: modified Markdown, deliverables, experience整理, cleanup, and remaining work."
