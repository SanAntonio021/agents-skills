interface:
  display_name: "chat-notes"
  short_description: "整理可复用经验与受影响的说明；按已有授权清场，修改技能后自动发布与同步"
  default_prompt: "Use $chat-notes to extract verified, reusable lessons from this conversation and its actual changes. Update the relevant existing project document or skill and affected documentation. Reuse clear rules; create a file only when necessary new information cannot fit an existing file. Compare upstream approaches when evidence or an improvement decision requires it. Give a brief proposal when a concrete change is not yet authorized. Finish cleanup within existing authorization while preserving deliverables, editable originals, evidence, and valid references. Reorganize only when requested, and keep unresolved issues and their recovery in an appropriate existing record. Complete authorized skill edits, proportionate checks, commit, push, and background synchronization unless the user limits the work to local edits."
