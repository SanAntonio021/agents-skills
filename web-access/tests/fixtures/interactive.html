<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>web-access protocol v2 fixture</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; }
    label, fieldset, [contenteditable], button { display: block; margin: 12px 0; }
    input, select, [contenteditable], button { min-width: 180px; min-height: 32px; }
    [contenteditable] { border: 1px solid #555; padding: 6px; }
  </style>
</head>
<body>
  <h1>Protocol v2 fixture</h1>
  <label>Name <input id="name" aria-label="Name" autocomplete="off"></label>
  <div id="notes" role="textbox" aria-label="Notes" contenteditable="true"></div>
  <label><input id="remember" type="checkbox"> Remember</label>
  <label>Choices
    <select id="choices" aria-label="Choices" multiple size="3">
      <option value="one">One</option>
      <option value="two">Two</option>
      <option value="three">Three</option>
    </select>
  </label>
  <button id="submit" type="button">Submit</button>
  <button id="dialog" type="button">Open dialog</button>
  <div id="status" aria-live="polite">Idle</div>
  <script>
    const nameInput = document.getElementById('name');
    nameInput.addEventListener('input', () => {
      nameInput.dataset.controlledValue = nameInput.value;
    });
    document.getElementById('dialog').addEventListener('click', () => {
      window.confirm('Continue fixture action?');
    });
    window.replaceSubmit = () => {
      const current = document.getElementById('submit');
      const replacement = current.cloneNode(true);
      current.replaceWith(replacement);
    };
    window.hideSubmit = () => {
      document.getElementById('submit').style.display = 'none';
    };
    window.scheduleSaved = () => {
      setTimeout(() => { document.getElementById('status').textContent = 'Saved'; }, 150);
    };
  </script>
</body>
</html>
