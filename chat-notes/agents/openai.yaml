interface:
  display_name: "chat-notes"
  short_description: "整理对话经验并判断写入位置；默认先给简短审查稿，批准后再修改和清场"
  default_prompt: "Use $chat-notes to review the current conversation and decide whether each reusable lesson belongs in the current project, an existing skill, a new skill, or nowhere. Before proposing a skill change, classify the cause as a missing rule, an incomplete rule, or a clear rule that was not followed, and identify the exact gap. Perform local and external checks internally when needed. Return a short review draft, normally no more than 10 lines: always include the conclusion and one reason; include one to three proposed changes and one approval question only when an actual change is proposed. For 'no change', stop after the reason. Do not list excluded work or show comparison tables unless they change the decision. After approval, follow the skill's edit, cleanup, commit, and push gates."
