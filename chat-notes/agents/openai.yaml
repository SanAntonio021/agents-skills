interface:
  display_name: "chat-notes"
  short_description: "整理经验后实际清理当前项目本轮及历史无用过程文件，核验成果并给出最终文件链接"
  default_prompt: "Use $chat-notes to identify the current project and deliverables, extract verified reusable lessons, complete authorized records and necessary publication, then actually clean up and verify the results. Invoking this skill includes authorization for recoverable cleanup of proven unused process files from this project, including historical leftovers; do not ask for separate cleanup permission. Mere discussion of the skill, explicit read-only requests, no-deletion instructions, scope limits, and host restrictions take precedence. Reuse existing documents and skills, propose concrete experience edits that are not yet authorized, and compare upstream approaches when the decision needs external evidence. No new lessons, pending experience approval, or failed publication must not stop independent cleanup. Preserve originals, current deliverables or pending working drafts, designated comparison versions, maintained source and tests, dependencies, necessary evidence, user edits, and active files. Process known safe items while retaining and reporting uncertain or blocked items; verify recovery before deletion and ask about exact targets if only permanent deletion is possible. Do not sweep parent workspaces, other projects, or external symlink targets. Verify actual removal, usable retained files, dependencies and references. Return clickable final-file links first, or label the current draft as pending, then summarize lessons, actual cleanup and unresolved items. Reuse an existing delivery index; do not generate extra cleanup reports or final copies. Reorganize only when requested. Complete authorized skill edits, proportionate checks, commit, push and supported background synchronization unless explicitly limited, preserving recovery information for unresolved issues."
