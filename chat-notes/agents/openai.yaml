interface:
  display_name: "chat-notes"
  short_description: "提取可复用经验并更新合适的已有说明；获准修改技能后自动完成发布与同步"
  default_prompt: "Use $chat-notes to extract verified, reusable lessons from this conversation and its actual changes. Prefer the relevant existing project document or skill; do not add equivalent rules or files without new information. Give a brief proposal when a concrete change is not yet authorized. Complete authorized skill edits, proportionate checks, commit, push, and background synchronization unless the user limits the work to local edits."
