interface:
  display_name: "chat-notes"
  short_description: "显式收尾时检查 Markdown、实验记录、经验、清理和发布状态"
  default_prompt: "只在用户显式调用 $chat-notes 或明确要求按本技能收尾时使用。先读 SKILL.md，确认项目、任务、材料和限制，再处理五项工作：项目 Markdown、飞书与实验文档、经验与技能缺口、过程文件清理、提交发布与运行时同步。按工作区职责推导文档结构，不套固定栏目，不按篇幅强拆；每项事实只留一个权威落点，先归位后清理，保护证据和用户修改。限制内继续已授权工作。项目提交与技能发布分开，使用受支持入口精确发布，并以相同参数运行 VerifyOnly 复查。按五项反馈汇报。"
