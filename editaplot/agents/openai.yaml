interface:
  display_name: "EditaPlot"
  short_description: "生成、准备并审阅可编辑 Origin 科研图"
  default_prompt: "请使用 $editaplot 检查环境并只读分析我提供的数据，沿用已明确的科学目的、列用途和配色；没有配色要求时采用合适的已验证模板默认配色，想挑选时再展示选项。数据更新后重新检查并生成匹配当前数据的方案，含义和已授权做法没变就继续，只询问实质歧义。通过本机隔离的 Origin 实例绘制并验证可编辑科研图；如果我说‘我用 Origin 改过图了’或‘审阅 OPJU’，请审阅已保存文件的隔离快照。交付时简短说明画了什么、成果在哪及影响使用的未解决问题，完整检查记录留在过程文件中。"
