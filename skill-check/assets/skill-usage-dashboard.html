<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>技能调用周报</title>
  <style>
    :root {
      --canvas: #f3f5f8;
      --surface: #ffffff;
      --surface-soft: #f7f9fb;
      --ink: #132238;
      --muted: #58677b;
      --border: #d8e0e9;
      --navy: #184c78;
      --navy-soft: #eaf1f7;
      --codex: #285cc4;
      --claude: #b45d28;
      --review: #a33a43;
      --review-soft: #faecee;
      --success: #247156;
      --zero: #8a98aa;
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    html { background: var(--canvas); }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background: var(--canvas);
      font-family: "Microsoft YaHei UI", "Segoe UI Variable", "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    button, input, select { font: inherit; }

    button, select, input {
      color: var(--ink);
      border: 1px solid var(--border);
      background: var(--surface);
    }

    button:focus-visible, select:focus-visible, input:focus-visible {
      outline: 3px solid rgba(40, 92, 196, 0.2);
      outline-offset: 2px;
    }

    .shell {
      width: min(1400px, calc(100% - 40px));
      margin: 0 auto;
      padding: 24px 0 36px;
    }

    .topbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 14px;
    }

    .context {
      margin: 0 0 2px;
      color: var(--navy);
      font-size: 12px;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-family: "Segoe UI Variable Display", "Microsoft YaHei UI", sans-serif;
      font-size: clamp(25px, 3vw, 34px);
      line-height: 1.15;
      letter-spacing: -0.025em;
    }

    .week-control {
      display: grid;
      grid-template-columns: auto minmax(210px, 245px);
      align-items: center;
      gap: 10px;
    }

    .week-control label, .field label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    select, input[type="search"] {
      width: 100%;
      min-height: 40px;
      padding: 8px 11px;
      border-radius: 8px;
    }

    .conclusion {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: center;
      padding: 20px 22px;
      border: 1px solid var(--border);
      border-left: 6px solid var(--navy);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .section-label {
      margin: 0 0 4px;
      color: var(--navy);
      font-size: 12px;
      font-weight: 800;
    }

    .conclusion h2 {
      margin: 0;
      font-family: "Segoe UI Variable Display", "Microsoft YaHei UI", sans-serif;
      font-size: clamp(21px, 2.4vw, 30px);
      line-height: 1.25;
      letter-spacing: -0.02em;
    }

    .conclusion-detail {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .status-line {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      max-width: 380px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 28px;
      padding: 4px 9px;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface-soft);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .badge::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--zero);
    }

    .badge.complete::before { background: var(--success); }
    .badge.incomplete::before { background: var(--review); }

    .metrics {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      margin: 14px 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .metric {
      min-width: 0;
      padding: 13px 16px;
      border-right: 1px solid var(--border);
    }

    .metric:last-child { border-right: 0; }

    .metric-label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .metric-value {
      display: block;
      margin-top: 3px;
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 25px;
      font-weight: 750;
      line-height: 1.15;
      letter-spacing: -0.04em;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 310px;
      gap: 14px;
      align-items: start;
    }

    .panel {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
    }

    .panel-title { margin: 0; font-size: 17px; letter-spacing: -0.01em; }
    .panel-kicker { margin: 3px 0 0; color: var(--muted); font-size: 12px; }

    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .legend-item { display: inline-flex; align-items: center; gap: 6px; }
    .legend-swatch { width: 18px; height: 6px; border-radius: 99px; }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(190px, 1fr) auto minmax(155px, 190px);
      gap: 10px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-soft);
    }

    .field { display: grid; gap: 5px; }

    .segmented {
      display: inline-grid;
      grid-template-columns: repeat(3, auto);
      gap: 3px;
      align-self: end;
      padding: 3px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface);
    }

    .segmented button {
      min-height: 32px;
      padding: 5px 10px;
      color: var(--muted);
      border: 0;
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }

    .segmented button[aria-pressed="true"] {
      color: var(--navy);
      background: var(--navy-soft);
    }

    .spectrum-head,
    .spectrum-row {
      display: grid;
      grid-template-columns: minmax(170px, 235px) minmax(230px, 1fr) 76px;
      gap: 16px;
      align-items: center;
    }

    .spectrum-head {
      padding: 9px 18px;
      color: var(--muted);
      background: #fbfcfd;
      font-size: 12px;
      font-weight: 700;
    }

    .spectrum-list { min-height: 260px; }

    .spectrum-row {
      min-height: 62px;
      padding: 10px 18px;
      border-top: 1px solid var(--border);
    }

    .spectrum-row:hover { background: var(--surface-soft); }
    .spectrum-row.review { background: linear-gradient(90deg, var(--review-soft), transparent 64%); }

    .skill-name {
      overflow: hidden;
      color: var(--ink);
      font-size: 13px;
      font-weight: 750;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .skill-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
    }

    .mini-tag {
      padding: 1px 6px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
    }

    .mini-tag.review { color: var(--review); border-color: rgba(163, 58, 67, 0.35); }

    .rail-wrap { display: grid; gap: 6px; }

    .rail {
      display: flex;
      width: 100%;
      height: 11px;
      overflow: hidden;
      border-radius: 999px;
      background: #e7ecf2;
    }

    .bar { height: 100%; min-width: 0; transition: width 220ms ease; }
    .bar.codex { background: var(--codex); }
    .bar.claude { background: var(--claude); }
    .bar.zero {
      width: 100% !important;
      background: repeating-linear-gradient(135deg, #c6cfda 0 5px, #e7ecf2 5px 10px);
    }

    .rail-labels {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 11px;
    }

    .count {
      justify-self: end;
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 20px;
      font-weight: 750;
      letter-spacing: -0.04em;
    }

    .empty {
      display: grid;
      place-items: center;
      min-height: 240px;
      padding: 28px;
      color: var(--muted);
      text-align: center;
    }

    .review-panel { padding: 18px; }
    .review-panel h2 { margin: 0; font-size: 17px; }

    .review-count {
      margin: 4px 0 14px;
      color: var(--muted);
      font-size: 12px;
    }

    .review-list { display: grid; gap: 8px; }

    .review-item {
      padding: 11px 12px;
      border: 1px solid rgba(163, 58, 67, 0.24);
      border-left: 4px solid var(--review);
      border-radius: 9px;
      background: var(--review-soft);
    }

    .review-name { overflow-wrap: anywhere; font-size: 13px; font-weight: 800; }
    .review-detail { margin-top: 4px; color: var(--muted); font-size: 12px; }

    .review-empty {
      padding: 16px;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 9px;
      background: var(--surface-soft);
      font-size: 13px;
    }

    .method {
      margin: 14px 2px 0;
      color: var(--muted);
      font-size: 12px;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 1050px) {
      .workspace { grid-template-columns: 1fr; }
      .metrics { grid-template-columns: repeat(5, minmax(105px, 1fr)); overflow-x: auto; }
    }

    @media (max-width: 760px) {
      .shell { width: min(100% - 22px, 1400px); padding-top: 16px; }
      .topbar { align-items: stretch; flex-direction: column; gap: 12px; }
      .week-control { grid-template-columns: 70px 1fr; }
      .conclusion { grid-template-columns: 1fr; gap: 13px; padding: 17px 16px; }
      .status-line { justify-content: flex-start; max-width: none; }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); overflow: visible; }
      .metric { border-bottom: 1px solid var(--border); }
      .metric:nth-child(2n) { border-right: 0; }
      .metric:last-child { border-bottom: 0; }
      .toolbar { grid-template-columns: 1fr; }
      .segmented { grid-template-columns: repeat(3, 1fr); }
      .spectrum-head { display: none; }
      .spectrum-row { grid-template-columns: minmax(120px, 0.85fr) minmax(130px, 1fr) 54px; gap: 9px; padding: 10px 12px; }
      .footer { flex-direction: column; gap: 3px; }
    }

    @media (max-width: 480px) {
      .spectrum-row { grid-template-columns: minmax(105px, 0.9fr) minmax(95px, 1fr) 42px; }
      .skill-meta, .rail-labels { display: none; }
      .count { font-size: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="context">本地技能使用审计</p>
        <h1>技能调用周报</h1>
      </div>
      <div class="week-control">
        <label for="weekSelect">统计周期</label>
        <select id="weekSelect" aria-label="选择统计周期"></select>
      </div>
    </header>

    <section class="conclusion" aria-labelledby="conclusionTitle">
      <div>
        <p class="section-label">审计结论</p>
        <h2 id="conclusionTitle">正在载入本周结论</h2>
        <p class="conclusion-detail" id="conclusionDetail"></p>
      </div>
      <div class="status-line" id="statusLine" aria-live="polite"></div>
    </section>

    <section class="metrics" aria-label="核心指标">
      <article class="metric"><span class="metric-label">调用请求</span><span class="metric-value" id="metricTotal">—</span></article>
      <article class="metric"><span class="metric-label">Codex</span><span class="metric-value" id="metricCodex">—</span></article>
      <article class="metric"><span class="metric-label">Claude</span><span class="metric-value" id="metricClaude">—</span></article>
      <article class="metric"><span class="metric-label">本周未观测</span><span class="metric-value" id="metricZero">—</span></article>
      <article class="metric"><span class="metric-label">复核候选</span><span class="metric-value" id="metricReview">—</span></article>
    </section>

    <section class="workspace">
      <article class="panel">
        <div class="panel-head">
          <div>
            <h2 class="panel-title">技能调用频次</h2>
            <p class="panel-kicker" id="resultSummary">按调用请求数降序</p>
          </div>
          <div class="legend" aria-label="数据来源图例">
            <span class="legend-item"><span class="legend-swatch" style="background:var(--codex)"></span>Codex</span>
            <span class="legend-item"><span class="legend-swatch" style="background:var(--claude)"></span>Claude</span>
          </div>
        </div>

        <div class="toolbar">
          <div class="field">
            <label for="searchInput">技能名称</label>
            <input id="searchInput" type="search" autocomplete="off" placeholder="输入名称筛选">
          </div>
          <div class="segmented" role="group" aria-label="调用来源">
            <button type="button" data-host="total" aria-pressed="true">全部</button>
            <button type="button" data-host="codex" aria-pressed="false">Codex</button>
            <button type="button" data-host="claude" aria-pressed="false">Claude</button>
          </div>
          <div class="field">
            <label for="stateFilter">观测状态</label>
            <select id="stateFilter">
              <option value="all">全部技能</option>
              <option value="observed">本周已观测</option>
              <option value="zero">本周未观测</option>
              <option value="review">复核候选</option>
              <option value="source_only">仅源目录</option>
            </select>
          </div>
        </div>

        <div class="spectrum-head" aria-hidden="true"><span>技能</span><span>调用请求</span><span style="text-align:right">次数</span></div>
        <div class="spectrum-list" id="spectrumList" aria-live="polite"></div>
      </article>

      <aside class="panel review-panel">
        <h2>复核候选</h2>
        <p class="review-count" id="reviewCount">正在载入</p>
        <div class="review-list" id="reviewList"></div>
      </aside>
    </section>

    <p class="method">统计单位：用户请求；同一请求内，同一技能只计 1 次。Codex 数据为可观测下界。</p>

    <footer class="footer">
      <span id="coverageNote">正在核验数据覆盖</span>
      <span id="generatedAt"></span>
    </footer>
  </main>

  <script>
    "use strict";
    const DATA = __SKILL_USAGE_DATA__;
    const state = { week: 0, host: "total", filter: "all", query: "" };

    const elements = {
      weekSelect: document.getElementById("weekSelect"),
      searchInput: document.getElementById("searchInput"),
      stateFilter: document.getElementById("stateFilter"),
      spectrumList: document.getElementById("spectrumList"),
      reviewList: document.getElementById("reviewList"),
      reviewCount: document.getElementById("reviewCount"),
      statusLine: document.getElementById("statusLine"),
      conclusionTitle: document.getElementById("conclusionTitle"),
      conclusionDetail: document.getElementById("conclusionDetail"),
      resultSummary: document.getElementById("resultSummary"),
      coverageNote: document.getElementById("coverageNote"),
      generatedAt: document.getElementById("generatedAt")
    };

    const number = new Intl.NumberFormat("zh-CN");

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function currentWeek() { return Array.isArray(DATA) ? DATA[state.week] : null; }

    function formatDate(value, includeTime = false) {
      if (!value) return "未知";
      const parsed = new Date(value);
      if (Number.isNaN(parsed.valueOf())) return String(value);
      const options = { year: "numeric", month: "2-digit", day: "2-digit" };
      if (includeTime) Object.assign(options, { hour: "2-digit", minute: "2-digit", hour12: false });
      return new Intl.DateTimeFormat("zh-CN", options).format(parsed);
    }

    function hostCount(row) { return Number(row.counts?.[state.host] || 0); }

    function setMetric(id, value) { document.getElementById(id).textContent = number.format(value || 0); }

    function renderConclusion(week) {
      const counts = week.counts || {};
      const rows = Array.isArray(week.skills) ? week.skills : [];
      const active = Number(counts.active ?? rows.filter(row => row.status !== "source_only").length);
      const observed = Number(counts.observed ?? rows.filter(row => Number(row.counts?.total || 0) > 0).length);
      const zero = Number(counts.zero || 0);
      const review = Number(counts.review || 0);

      if (!week.complete) {
        elements.conclusionTitle.textContent = "本周数据不完整，暂不形成低活跃度结论";
        elements.conclusionDetail.textContent = "当前覆盖存在缺口，本周不计入连续未观测周期。";
      } else if (review > 0) {
        elements.conclusionTitle.textContent = `发现 ${number.format(review)} 个需人工复核的低活跃技能`;
        elements.conclusionDetail.textContent = `${number.format(active)} 个已激活技能中，${number.format(observed)} 个存在调用记录，${number.format(zero)} 个本周未观测到调用。`;
      } else {
        elements.conclusionTitle.textContent = "本周无技能进入低活跃度复核";
        elements.conclusionDetail.textContent = `${number.format(active)} 个已激活技能中，${number.format(observed)} 个存在调用记录，${number.format(zero)} 个本周未观测到调用。`;
      }
    }

    function renderStatus(week) {
      elements.statusLine.replaceChildren();
      elements.statusLine.append(el("span", `badge ${week.complete ? "complete" : "incomplete"}`, week.complete ? "数据完整" : "数据不完整"));
      elements.statusLine.append(el("span", "badge", `${formatDate(week.window?.start)} — ${formatDate(week.window?.end)}`));
      if (week.streak_reset_reason) elements.statusLine.append(el("span", "badge incomplete", "连续周期已重置"));
    }

    function renderMetrics(week) {
      const rows = Array.isArray(week.skills) ? week.skills : [];
      setMetric("metricTotal", rows.reduce((sum, row) => sum + Number(row.counts?.total || 0), 0));
      setMetric("metricCodex", rows.reduce((sum, row) => sum + Number(row.counts?.codex || 0), 0));
      setMetric("metricClaude", rows.reduce((sum, row) => sum + Number(row.counts?.claude || 0), 0));
      setMetric("metricZero", week.counts?.zero || 0);
      setMetric("metricReview", week.counts?.review || 0);
    }

    function statusMatches(row) {
      if (state.filter === "all") return true;
      if (state.filter === "zero") return row.status === "zero" || row.status === "review";
      return row.status === state.filter;
    }

    function renderSpectrum(week) {
      const query = state.query.trim().toLocaleLowerCase("zh-CN");
      const allRows = Array.isArray(week.skills) ? week.skills : [];
      const rows = allRows
        .filter(row => statusMatches(row) && String(row.skill || "").toLocaleLowerCase("zh-CN").includes(query))
        .sort((a, b) => hostCount(b) - hostCount(a) || Number(b.counts?.total || 0) - Number(a.counts?.total || 0) || String(a.skill).localeCompare(String(b.skill), "zh-CN"));
      elements.spectrumList.replaceChildren();
      const sourceLabel = state.host === "total" ? "总调用请求数" : state.host === "codex" ? "Codex 调用请求数" : "Claude 调用请求数";
      elements.resultSummary.textContent = `显示 ${number.format(rows.length)} 项，按${sourceLabel}降序`;
      if (!rows.length) {
        elements.spectrumList.append(el("div", "empty", "当前条件无匹配技能。"));
        return;
      }

      const max = Math.max(1, ...rows.map(hostCount));
      const fragment = document.createDocumentFragment();
      rows.forEach(row => {
        const wrapper = el("div", `spectrum-row${row.status === "review" ? " review" : ""}`);
        const identity = el("div");
        identity.append(el("div", "skill-name", String(row.skill || "未命名技能")));
        const meta = el("div", "skill-meta");
        const hosts = Array.isArray(row.active_hosts) && row.active_hosts.length ? row.active_hosts.join(" + ") : "仅源目录";
        meta.append(el("span", "mini-tag", hosts));
        if (row.zero_streak) meta.append(el("span", `mini-tag${row.review_candidate ? " review" : ""}`, `连续 ${row.zero_streak} 周未观测`));
        identity.append(meta);

        const railWrap = el("div", "rail-wrap");
        const rail = el("div", "rail");
        rail.setAttribute("aria-label", `${row.skill}：Codex ${row.counts?.codex || 0} 次，Claude ${row.counts?.claude || 0} 次`);
        const selected = hostCount(row);
        if (selected === 0) {
          rail.append(el("span", "bar zero"));
        } else if (state.host === "total") {
          const scale = 100 / max;
          const codex = el("span", "bar codex");
          codex.style.width = `${Number(row.counts?.codex || 0) * scale}%`;
          const claude = el("span", "bar claude");
          claude.style.width = `${Number(row.counts?.claude || 0) * scale}%`;
          rail.append(codex, claude);
        } else {
          const bar = el("span", `bar ${state.host}`);
          bar.style.width = `${selected / max * 100}%`;
          rail.append(bar);
        }
        const labels = el("div", "rail-labels");
        labels.append(el("span", "", `Codex ${row.counts?.codex || 0}`), el("span", "", `Claude ${row.counts?.claude || 0}`));
        railWrap.append(rail, labels);
        wrapper.append(identity, railWrap, el("div", "count", number.format(selected)));
        fragment.append(wrapper);
      });
      elements.spectrumList.append(fragment);
    }

    function renderReview(week) {
      const rows = (Array.isArray(week.skills) ? week.skills : [])
        .filter(row => row.review_candidate || row.status === "review")
        .sort((a, b) => Number(b.zero_streak || 0) - Number(a.zero_streak || 0) || String(a.skill).localeCompare(String(b.skill), "zh-CN"));
      elements.reviewList.replaceChildren();
      elements.reviewCount.textContent = `${number.format(rows.length)} 个技能达到连续四周未观测条件`;
      if (!rows.length) {
        elements.reviewList.append(el("div", "review-empty", "暂无符合复核条件的技能。"));
        return;
      }
      rows.forEach(row => {
        const item = el("div", "review-item");
        item.append(el("div", "review-name", row.skill));
        item.append(el("div", "review-detail", `连续 ${row.zero_streak} 个完整周未观测到调用，需人工复核。`));
        elements.reviewList.append(item);
      });
    }

    function renderCoverage(week) {
      const parts = [];
      if (week.coverage?.missing_roots?.length) parts.push(`缺失 ${week.coverage.missing_roots.length} 个数据源`);
      if (week.coverage?.parse_error_count) parts.push(`${week.coverage.parse_error_count} 条解析错误`);
      if (week.coverage?.unmapped_request_count) parts.push(`${week.coverage.unmapped_request_count} 条记录无法关联请求`);
      elements.coverageNote.textContent = parts.length ? `覆盖异常：${parts.join("；")}` : "数据覆盖完整";
      elements.generatedAt.textContent = `生成时间：${formatDate(week.generated_at, true)}`;
    }

    function render() {
      const week = currentWeek();
      if (!week) {
        elements.conclusionTitle.textContent = "暂无周统计数据";
        elements.conclusionDetail.textContent = "请先运行一次技能周检。";
        elements.spectrumList.replaceChildren(el("div", "empty", "暂无数据。"));
        elements.reviewList.replaceChildren(el("div", "review-empty", "暂无数据。"));
        elements.reviewCount.textContent = "0 个复核候选";
        return;
      }
      renderConclusion(week);
      renderStatus(week);
      renderMetrics(week);
      renderSpectrum(week);
      renderReview(week);
      renderCoverage(week);
    }

    function initialize() {
      elements.weekSelect.replaceChildren();
      if (Array.isArray(DATA)) {
        DATA.forEach((week, index) => {
          const option = document.createElement("option");
          option.value = String(index);
          option.textContent = `${week.date || `第 ${index + 1} 周`} · ${week.complete ? "完整" : "不完整"}`;
          elements.weekSelect.append(option);
        });
      }
      elements.weekSelect.addEventListener("change", event => { state.week = Number(event.target.value || 0); render(); });
      elements.searchInput.addEventListener("input", event => { state.query = event.target.value; renderSpectrum(currentWeek()); });
      elements.stateFilter.addEventListener("change", event => { state.filter = event.target.value; renderSpectrum(currentWeek()); });
      document.querySelectorAll("[data-host]").forEach(button => {
        button.addEventListener("click", () => {
          state.host = button.dataset.host;
          document.querySelectorAll("[data-host]").forEach(candidate => candidate.setAttribute("aria-pressed", String(candidate === button)));
          renderSpectrum(currentWeek());
        });
      });
      render();
    }

    initialize();
  </script>
</body>
</html>
